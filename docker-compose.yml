services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ra_user
      POSTGRES_PASSWORD: ra_password_dev
      POSTGRES_DB: ra_db
    ports:
      - "5432:5432"
    volumes:
      - ra_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ra_user -d ra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ra_pg_data: