[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Toji", email = "vargascardenassamueljavier@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.0",
    "langchain>=1.3.14",
    "markdown>=3.10.2",
    "networkx>=3.6.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.39",
]

[project.scripts]
backend = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
